[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neuromesh"
version = "0.1.0"
description = "Brain-inspired LLM multi-agent networks: effects of scale and topology on collective information processing"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Mihir Mathur" },
  { name = "Yutong Dai" },
  { name = "Armman Jhamb" },
  { name = "Andrew Blaze Pitta" },
]
dependencies = [
  "networkx>=3.2",
  "numpy>=1.26",
  "pandas>=2.1",
  "pyarrow>=14",
  "pydantic>=2.5",
  "pyyaml>=6.0",
  # Required by networkx>=3.2: nx.pagerank dispatches to its SciPy sparse
  # implementation (_pagerank_scipy), which imports scipy at call time. Floor
  # matches networkx's own "default" extra (scipy>=1.11.2). Declared directly
  # rather than via networkx[default], which would also pull in matplotlib and
  # pandas that this project does not need from networkx.
  "scipy>=1.11.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5"]

[project.scripts]
neuromesh = "neuromesh.runner.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
